services:
  postgres:
    image: postgres:17
    container_name: music-practice-buddy-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  flyway:
    image: flyway/flyway:latest
    container_name: music-practice-buddy-flyway

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - '-url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}'
      - '-user=${POSTGRES_USER}'
      - '-password=${POSTGRES_PASSWORD}'
      - '-locations=filesystem:/flyway/sql'
      - 'migrate'

    volumes:
      - ./packages/core/migrations:/flyway/sql:ro

  seed:
    image: postgres:17
    container_name: music-practice-buddy-seed
    profiles: ['seed']

    depends_on:
      flyway:
        condition: service_completed_successfully

    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}

    volumes:
      - ./db/test_data/test_data.sql:/seed/test_data.sql:ro

    command:
      - psql
      - -f
      - /seed/test_data.sql

volumes:
  postgres_data:
