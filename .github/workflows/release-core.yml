name: Release core package

on:
  push:
    tags:
      - 'core-v*'

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, package, and release core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#core-v}"

          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Expected a tag such as core-v1.2.3 or core-v1.2.3-beta.1; received ${tag}." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:all

      - name: Build the community application
        run: npm run build

      - name: Stamp and package core
        id: package
        env:
          CORE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          npm pkg set --workspace @music-practice-buddy/core "version=${CORE_VERSION}"
          npm run package:core

          artifact_name="music-practice-buddy-core-${CORE_VERSION}.tgz"
          artifact_path="artifacts/${artifact_name}"
          test -f "${artifact_path}"

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=${artifact_path}" >> "${GITHUB_OUTPUT}"

      - name: Create release metadata
        env:
          CORE_RELEASE_ARTIFACT: ${{ steps.package.outputs.artifact_path }}
          CORE_RELEASE_COMMIT: ${{ github.sha }}
          CORE_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/create-core-release-metadata.mjs

      - name: Upload packaged core to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.artifact_path }}.sha256
            artifacts/core-release.json
          if-no-files-found: error

      - name: Attest the package
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.artifact_path }}

      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CORE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "Release ${RELEASE_TAG} is already published; refusing to replace it." >&2
              exit 1
            fi
            exit 0
          fi

          prerelease=()
          if [[ "${CORE_VERSION}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Core ${CORE_VERSION}" \
            "${prerelease[@]}"

      - name: Upload release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARTIFACT_PATH: ${{ steps.package.outputs.artifact_path }}
        shell: bash
        run: |
          gh release upload "${RELEASE_TAG}" \
            "${ARTIFACT_PATH}" \
            "${ARTIFACT_PATH}.sha256" \
            artifacts/core-release.json \
            --clobber
          gh release edit "${RELEASE_TAG}" --draft=false
